[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dvlm"
version = "0.1.0"
description = "Decentralized vision-language model inference: disaggregated vision encoders + pipeline-sharded decoders over a peer swarm."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "transformers>=5.0",
    "safetensors",
    "huggingface_hub",
    "msgpack>=1.0",
    "numpy",
    "pillow",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
dvlm = "dvlm.cli:main"

[tool.setuptools.packages.find]
include = ["dvlm*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
